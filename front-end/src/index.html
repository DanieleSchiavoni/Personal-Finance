<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <title>Personal Finance</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <script>
    // Applica subito il tema scelto, prima che Angular parta, per evitare il lampeggio
    (function () {
      try {
        var scelta = localStorage.getItem('pf_tema');
        var scuro = scelta ? scelta === 'scuro' : window.matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.setAttribute('data-bs-theme', scuro ? 'dark' : 'light');
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
