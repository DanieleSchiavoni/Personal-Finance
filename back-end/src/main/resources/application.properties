spring.application.name=personal-finance
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

server.port=${SERVER_PORT:8080}

# Evita query lazy "nascoste" nel livello web
spring.jpa.open-in-view=false

spring.jackson.time-zone=UTC

# Le date nei parametri delle richieste (?dal=2026-10-01) sono in formato ISO
spring.mvc.format.date=iso

# Origini ammesse dal CORS (frontend Angular in sviluppo)
app.cors.origini=http://localhost:4200

# JWT: il segreto arriva SOLO da variabile d'ambiente (minimo 32 caratteri)
app.jwt.secret=${JWT_SECRET:}
app.jwt.access-ttl-minuti=15
app.jwt.refresh-ttl-giorni=7

# Account amministratore iniziale: creato all'avvio solo se non esiste gia un admin
app.admin.username=${ADMIN_USERNAME:}
app.admin.email=${ADMIN_EMAIL:}
app.admin.password=${ADMIN_PASSWORD:}

# Senza questa riga Spring Security crea un utente di prova con password casuale nel log
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
