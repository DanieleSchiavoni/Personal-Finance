spring.application.name=personal-finance
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

server.port=${SERVER_PORT:8080}

# Evita query lazy "nascoste" nel livello web
spring.jpa.open-in-view=false

spring.jackson.time-zone=UTC

# Le date nei parametri delle richieste (?dal=2026-10-01) sono in formato ISO
spring.mvc.format.date=iso

# Origini ammesse dal CORS (frontend Angular in sviluppo)
app.cors.origini=http://localhost:4200

# JWT: il segreto arriva SOLO da variabile d'ambiente (minimo 32 caratteri)
app.jwt.secret=${JWT_SECRET:}
app.jwt.access-ttl-minuti=15
app.jwt.refresh-ttl-giorni=7

# Account amministratore iniziale: creato all'avvio solo se non esiste gia un admin
app.admin.username=${ADMIN_USERNAME:}
app.admin.email=${ADMIN_EMAIL:}
app.admin.password=${ADMIN_PASSWORD:}

# Senza questa riga Spring Security crea un utente di prova con password casuale nel log
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

# Notizie di economia internazionale: feed RSS pubblici delle testate
app.notizie.abilitato=true
app.notizie.minuti-cache=15
app.notizie.fonti[0].nome=BBC News
app.notizie.fonti[0].url=https://feeds.bbci.co.uk/news/business/rss.xml
app.notizie.fonti[0].lingua=en
app.notizie.fonti[1].nome=The Guardian
app.notizie.fonti[1].url=https://www.theguardian.com/business/economics/rss
app.notizie.fonti[1].lingua=en
app.notizie.fonti[2].nome=CNBC
app.notizie.fonti[2].url=https://www.cnbc.com/id/20910258/device/rss/rss.html
app.notizie.fonti[2].lingua=en
app.notizie.fonti[3].nome=MarketWatch
app.notizie.fonti[3].url=https://feeds.content.dowjones.io/public/rss/mw_topstories
app.notizie.fonti[3].lingua=en
app.notizie.fonti[4].nome=ANSA Economia
app.notizie.fonti[4].url=https://www.ansa.it/sito/notizie/economia/economia_rss.xml
app.notizie.fonti[4].lingua=it
